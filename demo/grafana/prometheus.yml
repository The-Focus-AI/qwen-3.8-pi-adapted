global:
  # 1s so last-request tok/s gauges are less likely to be missed (they zero when idle)
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: llama-server
    metrics_path: /metrics
    static_configs:
      # Docker Desktop (Mac/Windows): host machine
      - targets: ["host.docker.internal:9931"]
        labels:
          service: qwen3.8-pi
